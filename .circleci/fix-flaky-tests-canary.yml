version: 2.1

parameters:
  pre-command:
    type: string
    default: "echo 'No pre-command'"
    description: "Command to run before the fix-flaky-tests command"
  post-command:
    type: string
    default: "echo 'No post-command'"
    description: "Command to run after the fix-flaky-tests command"
  max-tests:
    type: integer
    default: 1
    description: "The maximum number of tests to fix in a single run (defaults to 1)"
  max-prs:
    type: integer
    default: -1
    description: "The maximum number of PRs to open (-1 for unlimited, defaults to unlimited)"
  variations:
    type: integer
    default: 1
    description: "The number of fix variations to try in a single run (defaults to 1)"
  validations:
    type: integer
    default: 2
    description: "The number of test runs to validate the fix (defaults to 2)"
  no-output-timeout:
    type: string
    default: "30m"
    description: "The number of minutes to wait for output from the fix-flaky-tests command (defaults to 30m)"
  disable-response-storage:
    type: boolean
    default: false
    description: "Disable response storage for enterprise accounts with zero data retention"

executors:
  sandbox:
    machine:
      image: ubuntu-2404:current
    resource_class: large

commands:
  setup-sandbox:
    steps:
      - run:
          name: Setup sandbox
          command: |
            nvm install v22.15.1
            nvm alias default v22.15.1
      - run:
          name: "Configure node"
          command: |
            echo 'nvm use default' >> $BASH_ENV
      - run:
          name: Install agents
          command: |
            npm install -g @circleci/agents@canary
            npm install -g opencode-ai@0.6.5
            npm install -g @anthropic-ai/claude-code@1.0.108
jobs:
  fix-flaky-tests:
    executor: sandbox
    steps:
      - setup-sandbox
      - checkout
      - run:
          name: Pre-command
          command: "<< pipeline.parameters.pre-command >>"
      - run:
          name: Fix flaky tests
          no_output_timeout: "<< pipeline.parameters.no-output-timeout >>"
          command: |
            agents fix-flaky-tests \
              --git-url << pipeline.project.git_url >> \
              --post-command "<< pipeline.parameters.post-command >>" \
              --max-tests << pipeline.parameters.max-tests >> \
              --max-prs << pipeline.parameters.max-prs >> \
              --variations << pipeline.parameters.variations >> \
              --validations << pipeline.parameters.validations >> \
              <<# pipeline.parameters.disable-response-storage >>--disable-response-storage<</ pipeline.parameters.disable-response-storage >>
      - run:
          name: Report failure to CircleCI
          when: on_fail
          command: |
            agents report-fix-flaky-tests
      - store_artifacts:
          path: /tmp/test-artifacts
          when: always
      - store_artifacts:
          path: flaky-tests-output
          when: always
      - store_artifacts:
          path: /tmp/logs/setup-environment.jsonl
          destination: setup-environment.jsonl
          when: always
      - store_artifacts:
          path: /tmp/logs/go-private-deps-discovery.jsonl
          destination: go-private-deps-discovery-log.jsonl
          when: always
      - run:
          name: Git ignore generated artifacts
          command: |
            echo "fix-flaky-tests-execution-output.json" >> .git/info/exclude
      - persist_to_workspace:
          root: .
          paths:
            - .

workflows:
  flaky-tests-fixer:
    jobs:
      - fix-flaky-tests:
          context:
            - circleci-agents
