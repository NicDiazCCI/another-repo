version: 2.1
parameters:
  run_scheduled_tests:
    type: boolean
    default: false
  run_custom_task:
    type: boolean
    default: false
orbs:
  node: circleci/node@7
jobs:
  build-node:
    # Build node project
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          command: npm run build
      - run:
          name: Create the ~/artifacts directory if it doesn't exist
          command: mkdir -p ~/artifacts
      # Copy output to artifacts dir
      - run:
          name: Copy artifacts
          command: cp -R build dist public .output .next .docusaurus ~/artifacts 2>/dev/null || true
      - store_artifacts:
          path: ~/artifacts
          destination: node-build
  test-node:
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Run tests
          command: |
            mkdir -p test-results
            export JEST_JUNIT_OUTPUT="test-results/junit.xml"
            TEST_FILES=$(circleci tests glob "src/**/*.{test,spec}.{js,ts}")
            echo "$TEST_FILES" | circleci tests run --command="xargs npm run test:run -- --reporters=default --reporters=jest-junit" --verbose
      - store_test_results:
          path: test-results
  custom-task:
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Run and validate custom scheduled task
          command: |
            set -e
            node scripts/custom-task.js | tee custom-task-output.json
            node -e "const fs=require('fs');const t=fs.readFileSync('custom-task-output.json','utf8').trim().split(/\r?\n/).pop();const o=JSON.parse(t);function a(c,m){if(!c){throw new Error(m)}}a(o.task==='custom-scheduled-task','task mismatch');a(typeof o.package==='string'&&o.package.length>0,'bad package');a(/^\d{4}-\d{2}-\d{2}T/.test(o.date),'bad date');a(Number.isInteger(o.checksum)&&o.checksum>=0&&o.checksum<100000,'bad checksum');a(/^v\d+\./.test(o.node),'bad node');console.log('Custom task output valid')"
workflows:
  build:
    jobs:
      - build-node
  test:
    jobs:
      - test-node
  scheduled-tests:
    triggers:
      - schedule:
          cron: "0 3 * * *"
          filters:
            branches:
              only:
                - main
    jobs:
      - test-node
  scheduled-tests-manual:
    when:
      equal: [ << pipeline.parameters.run_scheduled_tests >>, true ]
    jobs:
      - test-node
  scheduled-custom-task:
    triggers:
      - schedule:
          cron: "15 3 * * *"
          filters:
            branches:
              only:
                - main
    jobs:
      - custom-task
  scheduled-custom-task-manual:
    when:
      equal: [ << pipeline.parameters.run_custom_task >>, true ]
    jobs:
      - custom-task
